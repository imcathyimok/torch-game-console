<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #10131c;
      color: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .game {
      width: min(92vw, 520px);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: #191e2b;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 56px);
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: #bac4d8;
      line-height: 1.6;
    }

    button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #70e2b2;
      color: #09120e;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .score {
      margin-top: 18px;
      font-size: 18px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>🎮</h1>
    <p>这是一个占位示例游戏。点击按钮计分，之后可以直接替换成你的单文件 HTML 游戏。</p>
    <button id="scoreButton" type="button">加 1 分</button>
    <div class="score">Score: <span id="score">0</span></div>
  </main>

  <script>
    (function () {
      var score = 0;
      var scoreEl = document.getElementById("score");
      var button = document.getElementById("scoreButton");

      button.addEventListener("click", function () {
        score += 1;
        scoreEl.textContent = String(score);
      });
    })();
  </script>
</body>
</html>
