<!DOCTYPE html>
<!--
GAME_META
title: 豆豆拼拼
author: 你的名字
description: 选颜色、点格子，在拼豆底板上拼出可爱图案并熨烫定型收藏。
controls: 点击/拖拽网格放置拼豆，点调色板选色，长按色块收藏；底部工具栏切换画笔/橡皮/吸管/填充等。
tags: 拼豆, 像素画, 治愈, 手工, 休闲
emoji: 🧩
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>豆豆拼拼 🧩</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,#FFFBF3 0%,#EFFAF5 55%,#FDF2FA 100%);
    color:#4A4540;overflow:hidden;user-select:none;
  }
  #app{
    display:flex;flex-direction:column;height:100vh;height:100dvh;
    max-width:1120px;margin:0 auto;padding:8px;gap:8px;
  }
  /* ---------- header ---------- */
  header{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:0 4px;min-height:36px;
  }
  .logo{font-size:19px;font-weight:800;letter-spacing:.5px;color:#3FA98A;white-space:nowrap;}
  .logo small{font-size:11px;color:#9CB8AE;font-weight:700;margin-left:4px;}
  .stats{display:flex;gap:6px;}
  .pill{
    background:#fff;border:2px solid #E6F5EF;border-radius:999px;
    padding:3px 11px;font-size:12.5px;font-weight:800;color:#6E8A80;
    box-shadow:0 3px 10px rgba(160,190,180,.22);white-space:nowrap;
  }
  .pill b{color:#3FA98A;}
  /* ---------- main ---------- */
  main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
  #stage{
    position:relative;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }
  #board{
    display:block;border-radius:20px;background:#FFFBF3;
    box-shadow:0 8px 26px rgba(150,180,170,.28);
    touch-action:none;cursor:crosshair;transition:filter .3s;
  }
  #board.ironing{filter:saturate(1.3) brightness(1.05);}
  /* 熨烫层 */
  #ironLayer{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .2s;z-index:10;overflow:hidden;border-radius:20px;
  }
  #ironLayer.on{opacity:1;}
  #ironLayer span{font-size:58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));}
  #ironLayer.on span{animation:ironSweep 1.5s ease-in-out;}
  @keyframes ironSweep{
    0%{transform:translateX(-160%) rotate(-18deg) scale(.9);}
    50%{transform:translateX(0) rotate(0deg) scale(1.05);}
    100%{transform:translateX(160%) rotate(18deg) scale(.9);}
  }
  /* toast */
  #toast{
    position:absolute;left:50%;bottom:12px;transform:translate(-50%,10px);
    background:rgba(63,169,138,.95);color:#fff;padding:8px 16px;border-radius:999px;
    font-size:13px;font-weight:800;opacity:0;pointer-events:none;white-space:nowrap;
    transition:opacity .25s,transform .25s;z-index:30;
    box-shadow:0 6px 18px rgba(63,169,138,.35);
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  /* ---------- 调色板 ---------- */
  #paletteWrap{
    flex:none;height:132px;background:#fff;border:2px solid #EAF6F1;
    border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:6px;
    box-shadow:0 6px 20px rgba(160,190,180,.2);
  }
  .pHead{display:flex;gap:6px;flex:none;}
  #search{
    flex:1;min-width:0;border:2px solid #EAF6F1;border-radius:12px;
    padding:5px 10px;font-size:13px;outline:none;background:#FBFFFD;
    font-family:inherit;color:#4A4540;
  }
  #search:focus{border-color:#A8E6CF;}
  #sizeBtn{
    flex:none;border:2px solid #EAF6F1;background:#F3FBF8;border-radius:12px;
    padding:5px 10px;font-size:12px;font-weight:800;color:#3FA98A;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  #sizeBtn:active{transform:scale(.95);}
  #palette{flex:1;overflow-y:auto;overflow-x:hidden;padding-right:3px;scrollbar-width:thin;}
  #palette::-webkit-scrollbar{width:5px;}
  #palette::-webkit-scrollbar-thumb{background:#DFF0E9;border-radius:4px;}
  .gTitle{font-size:11px;font-weight:800;color:#9CB8AE;margin:7px 0 4px;letter-spacing:1px;}
  .gTitle:first-child{margin-top:0;}
  .swGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(23px,1fr));gap:4px;}
  .empty{font-size:11px;color:#C3D5CE;padding:2px 0;font-weight:700;}
  .sw{
    aspect-ratio:1/1;border-radius:8px;border:2px solid rgba(0,0,0,.05);
    padding:0;cursor:pointer;transition:transform .12s;position:relative;
  }
  .sw:active{transform:scale(.88);}
  .sw.sel{outline:3px solid #3FA98A;outline-offset:1px;transform:scale(1.1);z-index:2;}
  .sw.fav::after{
    content:'★';position:absolute;top:-4px;right:-3px;font-size:9px;
    color:#FFB800;text-shadow:0 0 2px #fff;
  }
  /* ---------- 工具栏 ---------- */
  #toolbar{
    flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px;
    background:#fff;border:2px solid #EAF6F1;border-radius:20px;
    box-shadow:0 6px 20px rgba(160,190,180,.2);
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar{display:none;}
  .tb{
    flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;
    min-width:50px;border:none;background:#F7FCFA;border-radius:14px;
    padding:6px 7px;cursor:pointer;font-family:inherit;
    transition:background .15s,transform .1s;
  }
  .tb span{font-size:18px;line-height:1;}
  .tb small{font-size:10px;color:#8AA79D;font-weight:800;}
  .tb.active{background:#DFF5EC;box-shadow:inset 0 0 0 2px #A8E6CF;}
  .tb:active{transform:scale(.92);}
  /* ---------- 图鉴 ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(70,95,88,.35);z-index:60;
    display:flex;align-items:center;justify-content:center;padding:16px;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .modal.hidden{display:none;}
  .modalCard{
    background:#fff;border-radius:20px;width:100%;max-width:420px;max-height:82vh;
    display:flex;flex-direction:column;padding:14px;
    box-shadow:0 20px 50px rgba(80,120,110,.3);
  }
  .modalHead{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:#3FA98A;}
  .modalHead button{
    border:none;background:#F3FBF8;border-radius:50%;width:28px;height:28px;
    cursor:pointer;font-size:13px;color:#6E8A80;font-family:inherit;
  }
  #galList{
    margin-top:10px;overflow-y:auto;display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(84px,1fr));padding:2px;
  }
  .gItem{position:relative;border:2px solid #EAF6F1;border-radius:14px;overflow:hidden;background:#FBFFFD;cursor:pointer;}
  .gItem img{width:100%;aspect-ratio:1/1;display:block;object-fit:contain;}
  .gItem .del{
    position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
    border:none;background:rgba(255,255,255,.92);color:#E4738A;font-size:11px;
    line-height:1;cursor:pointer;font-family:inherit;
  }
  .galEmpty{grid-column:1/-1;text-align:center;color:#B8CFC7;font-size:13px;padding:24px 0;font-weight:700;}
  /* ---------- 桌面端 ---------- */
  @media (min-width:760px){
    main{flex-direction:row;}
    #paletteWrap{width:290px;height:auto;flex:none;}
    .tb{min-width:56px;}
    .tb span{font-size:20px;}
  }
  @media (max-height:560px){
    #paletteWrap{height:104px;}
    .tb small{display:none;}
    .tb{padding:6px 5px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🧩 豆豆拼拼<small>拼出你的小可爱</small></div>
    <div class="stats">
      <span class="pill">🪙 <b id="coins">0</b></span>
      <span class="pill">✨ <b id="progress">0%</b></span>
    </div>
  </header>

  <main>
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="ironLayer"><span>🔥</span></div>
      <div id="toast"></div>
    </div>

    <aside id="paletteWrap">
      <div class="pHead">
        <input id="search" type="text" placeholder="🔍 搜索颜色 / 分组" autocomplete="off">
        <button id="sizeBtn" type="button">16×16</button>
      </div>
      <div id="palette"></div>
    </aside>
  </main>

  <div id="toolbar"></div>
</div>

<div id="gallery" class="modal hidden">
  <div class="modalCard">
    <div class="modalHead"><b>📖 我的图鉴</b><button id="closeGal" type="button">✕</button></div>
    <div id="galList"></div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" style="display:none">

<script>
(function(){
'use strict';

/* ================= 调色板 ================= */
const GROUPS = [
  ['马卡龙',['#FFD1DC','#FFE5B4','#FFF6A9','#D4F0C0','#B5EAD7','#A8E6F0','#BBDEFB','#D0C4F5','#E8C7F0','#FFC8DD','#FDE2E4','#E2ECE9','#CDE7D0','#F7E1D7','#D6E5FA','#F3D9FA']],
  ['糖果',['#FF4D6D','#FF6B9D','#FF8FAB','#FFA07A','#FFB347','#FFD93D','#B5E48C','#52B788','#4CC9F0','#4895EF','#7B2CBF','#C77DFF','#F72585','#FF595E','#FFCA3A','#8AC926']],
  ['荧光',['#39FF14','#CCFF00','#FFFF00','#FF6EC7','#FF00FF','#00FFFF','#00FF7F','#FF3131','#FF5E00','#7FFF00','#00FFCC','#7DF9FF','#FF0090','#B026FF','#EFFF00','#00E5FF']],
  ['莫兰迪',['#B0A8B9','#9A8C98','#C9ADA7','#B8B8AA','#A3B18A','#8E9AAF','#A9BCD0','#CBC0D3','#D8E2DC','#E8E8E4','#B7B7A4','#A5A58D','#6B705C','#CB997E','#DDBEA9','#B5838D']],
  ['自然',['#2D6A4F','#40916C','#52B788','#74C69D','#95D5B2','#B7E4C7','#A7C957','#6A994E','#386641','#BC4749','#7F5539','#9C6644','#B08968','#DDB892','#E6CCB2','#EDE0D4']],
  ['复古',['#F4A261','#E76F51','#E9C46A','#264653','#2A9D8F','#8AB17D','#B5838D','#6D6875','#FFB4A2','#E5989B','#C9ADA7','#9D8189','#D4A373','#A47148','#7F4F24','#582F0E']],
  ['果酱',['#C1121F','#A4133C','#FF4D6D','#FF758F','#FF8FA3','#FFB3C1','#FFCCD5','#FFF0F3','#9D0208','#DC2F02','#E85D04','#F48C06','#FAA307','#FFBA08','#FFD60A','#FFF3B0']],
  ['柔光',['#E0AAFF','#C77DFF','#9D4EDD','#7B2CBF','#5A189A','#3C096C','#240046','#FFE0F7','#FFC2E2','#FFA6D5','#FF8FC7','#B8F2E6','#AED9E0','#9FA8DA','#C5CAE9','#E8EAF6']]
];
const PAL = [];
GROUPS.forEach(function(pair){
  const grp = pair[0], arr = pair[1];
  arr.forEach(function(hex, i){
    PAL.push({
      hex: hex, name: grp + (i + 1), group: grp,
      R: parseInt(hex.slice(1,3),16),
      G: parseInt(hex.slice(3,5),16),
      B: parseInt(hex.slice(5,7),16)
    });
  });
});

/* ================= 工具函数 ================= */
const TAU = Math.PI * 2;
function saveLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function loadLS(k, d){ try{ const s = localStorage.getItem(k); return s ? JSON.parse(s) : d; }catch(e){ return d; } }

const shadeCache = {};
function shadeHex(hex, f){
  const key = hex + '_' + f;
  const hit = shadeCache[key];
  if(hit) return hit;
  const r = Math.min(255, Math.round(parseInt(hex.slice(1,3),16) * f));
  const g = Math.min(255, Math.round(parseInt(hex.slice(3,5),16) * f));
  const b = Math.min(255, Math.round(parseInt(hex.slice(5,7),16) * f));
  const out = 'rgb(' + r + ',' + g + ',' + b + ')';
  shadeCache[key] = out;
  return out;
}

let audioCtx = null;
function beep(freq, dur, type, vol){
  if(!state.sound) return;
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.07, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.08));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + (dur || 0.08) + 0.03);
  }catch(e){}
}
let lastBeep = 0;
function tick(){
  const now = performance.now();
  if(now - lastBeep > 65){ lastBeep = now; beep(780, 0.03, 'triangle', 0.035); }
}

/* ================= DOM ================= */
const els = {
  stage: document.getElementById('stage'),
  board: document.getElementById('board'),
  ironLayer: document.getElementById('ironLayer'),
  toast: document.getElementById('toast'),
  palette: document.getElementById('palette'),
  search: document.getElementById('search'),
  sizeBtn: document.getElementById('sizeBtn'),
  toolbar: document.getElementById('toolbar'),
  coins: document.getElementById('coins'),
  progress: document.getElementById('progress'),
  gallery: document.getElementById('gallery'),
  galList: document.getElementById('galList'),
  closeGal: document.getElementById('closeGal'),
  fileInput: document.getElementById('fileInput')
};
const canvas = els.board;
const ctx = canvas.getContext('2d');

/* ================= 状态 ================= */
const SIZES = [16, 24, 32, 48];
let sizeIdx = 0;
let CELL = 18;

const state = {
  N: 16,
  grid: new Array(256).fill(null),
  tool: 'brush',
  color: '#FF8FAB',
  sound: true,
  recent: loadLS('dd_recent', []),
  favs: loadLS('dd_favs', []),
  undo: [],
  redo: []
};
if(!Array.isArray(state.recent)) state.recent = [];
if(!Array.isArray(state.favs)) state.favs = [];

/* 熨烫进度 0~1 */
let ironT = 0;
let ironRAF = null;

/* ================= 调色板渲染 ================= */
function swHTML(hex, fav){
  const sel = hex === state.color ? ' sel' : '';
  const f = fav ? ' fav' : '';
  return '<button type="button" class="sw' + sel + f + '" data-hex="' + hex +
         '" style="background:' + hex + '" title="' + hex + '"></button>';
}

function renderPalette(){
  const q = (els.search.value || '').trim().toLowerCase();
  let html = '';

  if(!q){
    html += '<div class="gTitle">🕘 最近使用</div><div class="swGrid" id="recentRow">';
    if(state.recent.length){
      state.recent.forEach(function(h){ html += swHTML(h, state.favs.indexOf(h) >= 0); });
    }else{
      html += '<span class="empty">点一下色块开始吧～</span>';
    }
    html += '</div>';

    html += '<div class="gTitle">⭐ 收藏（长按色块）</div><div class="swGrid">';
    if(state.favs.length){
      state.favs.forEach(function(h){ html += swHTML(h, true); });
    }else{
      html += '<span class="empty">长按色块即可收藏</span>';
    }
    html += '</div>';
  }

  GROUPS.forEach(function(pair){
    const grp = pair[0], arr = pair[1];
    let list = arr.map(function(hex, i){ return { hex: hex, name: grp + (i + 1) }; });
    if(q){
      list = list.filter(function(c){
        return c.name.toLowerCase().indexOf(q) >= 0 ||
               c.hex.toLowerCase().indexOf(q) >= 0 ||
               grp.toLowerCase().indexOf(q) >= 0;
      });
    }
    if(!list.length) return;
    html += '<div class="gTitle">' + grp + '</div><div class="swGrid">';
    list.forEach(function(c){ html += swHTML(c.hex, state.favs.indexOf(c.hex) >= 0); });
    html += '</div>';
  });

  if(!html) html = '<span class="empty">没有找到这个颜色呢 😢</span>';
  els.palette.innerHTML = html;
}

function syncSel(){
  const all = els.palette.querySelectorAll('.sw');
  for(let i = 0; i < all.length; i++){
    all[i].classList.toggle('sel', all[i].dataset.hex === state.color);
  }
}

let longPressed = false, pressTimer = null;
els.palette.addEventListener('pointerdown', function(e){
  const sw = e.target.closest ? e.target.closest('.sw') : null;
  if(!sw) return;
  longPressed = false;
  clearTimeout(pressTimer);
  const hex = sw.dataset.hex;
  pressTimer = setTimeout(function(){
    longPressed = true;
    toggleFav(hex);
  }, 550);
});
els.palette.addEventListener('pointerup', function(){ clearTimeout(pressTimer); });
els.palette.addEventListener('pointercancel', function(){ clearTimeout(pressTimer); });
els.palette.addEventListener('pointermove', function(){ clearTimeout(pressTimer); });
els.palette.addEventListener('click', function(e){
  const sw = e.target.closest ? e.target.closest('.sw') : null;
  if(!sw) return;
  if(longPressed){ longPressed = false; return; }
  selectColor(sw.dataset.hex);
});

function toggleFav(hex){
  const i = state.favs.indexOf(hex);
  if(i >= 0){ state.favs.splice(i, 1); toast('已取消收藏'); }
  else { state.favs.unshift(hex); if(state.favs.length > 24) state.favs.pop(); toast('已收藏 ⭐'); beep(920, 0.08); }
  saveLS('dd_favs', state.favs);
  renderPalette();
}

function selectColor(hex){
  state.color = hex;
  if(state.tool === 'eraser' || state.tool === 'pick'){
    state.tool = 'brush';
    updateToolbar();
  }
  const i = state.recent.indexOf(hex);
  if(i >= 0) state.recent.splice(i, 1);
  state.recent.unshift(hex);
  if(state.recent.length > 14) state.recent.length = 14;
  saveLS('dd_recent', state.recent);
  syncSel();
  const row = document.getElementById('recentRow');
  if(row){
    row.innerHTML = state.recent.map(function(h){ return swHTML(h, state.favs.indexOf(h) >= 0); }).join('');
  }
  beep(620, 0.04, 'sine', 0.04);
}

let searchTimer = null;
els.search.addEventListener('input', function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderPalette, 160);
});

/* ================= 画布 ================= */
function layout(){
  const rect = els.stage.getBoundingClientRect();
  let avail = Math.min(rect.width, rect.height) - 10;
  if(!isFinite(avail) || avail < 40) avail = 240;
  const N = state.N;
  CELL = Math.max(3, Math.floor(avail / N));
  const size = CELL * N;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  render();
}

/* ---------- 方圆形路径 ---------- */
function rrPath(cx, cy, size, radius){
  let s = size;
  if(s < 0.4) s = 0.4;
  const h = s / 2;
  let r = radius;
  if(r > h) r = h;
  if(r < 0) r = 0;
  const x = cx - h, y = cy - h;
  ctx.beginPath();
  if(r < 0.25){
    ctx.rect(x, y, s, s);
    return;
  }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + s - r, y);
  ctx.arcTo(x + s, y, x + s, y + r, r);
  ctx.lineTo(x + s, y + s - r);
  ctx.arcTo(x + s, y + s, x + s - r, y + s, r);
  ctx.lineTo(x + r, y + s);
  ctx.arcTo(x, y + s, x, y + s - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ---------- 扁平方圆形拼豆绘制 ---------- */
function render(){
  const N = state.N, cs = CELL;
  const W = N * cs;

  // 奶油底板
  ctx.fillStyle = '#FFFBF3';
  ctx.fillRect(0, 0, W, W);

  const it = ironT;                          // 0~1，熨烫进度

  // 豆子本体：方圆形，占满格子（相邻微微相切），熨烫时轻微膨胀
  const bodySize = cs * 0.98 * (1 + 0.05 * it);
  const bodyR = bodySize * 0.3;

  // 中心小方孔：熨烫时闭合
  const holeSize = cs * 0.28 * (1 - it);
  const holeR = holeSize * 0.32;
  const showHole = cs >= 9 && holeSize > 0.6;

  const lw = Math.max(0.5, cs * 0.08);

  // 空孔位（底板上没放豆子的方孔）
  const emptySize = cs * 0.46;
  const emptyR = emptySize * 0.32;
  ctx.fillStyle = '#F0E7DA';
  for(let y = 0; y < N; y++){
    const cy = (y + 0.5) * cs;
    for(let x = 0; x < N; x++){
      if(state.grid[y * N + x]) continue;
      rrPath((x + 0.5) * cs, cy, emptySize, emptyR);
      ctx.fill();
    }
  }

  // 已放置的方圆形豆豆
  let filled = 0;
  for(let y = 0; y < N; y++){
    const cy = (y + 0.5) * cs;
    const row = y * N;
    for(let x = 0; x < N; x++){
      const c = state.grid[row + x];
      if(!c) continue;
      filled++;
      const cx = (x + 0.5) * cs;

      // 方圆形本体
      rrPath(cx, cy, bodySize, bodyR);
      ctx.fillStyle = c;
      ctx.fill();

      // 扁平描边：豆子之间分界，熨烫时逐渐淡出
      if(it < 0.99){
        ctx.globalAlpha = 1 - it;
        ctx.lineWidth = lw;
        ctx.strokeStyle = shadeHex(c, 0.84);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 中心小方孔
      if(showHole){
        rrPath(cx, cy, holeSize, holeR);
        ctx.fillStyle = shadeHex(c, 0.68);
        ctx.fill();
      }
    }
  }

  const total = N * N;
  els.coins.textContent = String(filled);
  els.progress.textContent = Math.round(filled / total * 100) + '%';
}

let rafPending = false;
function draw(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){ rafPending = false; render(); });
}

/* ================= 绘制逻辑 ================= */
function cellFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  if(!rect.width || !rect.height) return null;
  const x = Math.floor((e.clientX - rect.left) / rect.width * state.N);
  const y = Math.floor((e.clientY - rect.top) / rect.height * state.N);
  if(x < 0 || y < 0 || x >= state.N || y >= state.N) return null;
  return { x: x, y: y };
}

function paintAt(x, y){
  const N = state.N;
  if(x < 0 || y < 0 || x >= N || y >= N) return;
  const i = y * N + x;
  const v = (state.tool === 'eraser') ? null : state.color;
  if(state.grid[i] !== v) state.grid[i] = v;
}

function lineTo(x0, y0, x1, y1, fn){
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, guard = 0;
  while(guard++ < 5000){
    fn(x0, y0);
    if(x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if(e2 > -dy){ err -= dy; x0 += sx; }
    if(e2 < dx){ err += dx; y0 += sy; }
  }
}

function pickAt(x, y){
  const c = state.grid[y * state.N + x];
  if(c){ selectColor(c); toast('吸取了颜色 💧'); }
  else toast('这里是空的哦');
}

function floodFill(x, y){
  const N = state.N, idx = y * N + x;
  const target = state.grid[idx];
  const repl = state.color;
  if(target === repl) return;
  const seen = new Uint8Array(N * N);
  const stack = [idx];
  seen[idx] = 1;
  let guard = 0;
  while(stack.length && guard++ < N * N * 2){
    const i = stack.pop();
    state.grid[i] = repl;
    const cx = i % N, cy = (i / N) | 0;
    if(cx > 0 && !seen[i-1] && state.grid[i-1] === target){ seen[i-1] = 1; stack.push(i-1); }
    if(cx < N-1 && !seen[i+1] && state.grid[i+1] === target){ seen[i+1] = 1; stack.push(i+1); }
    if(cy > 0 && !seen[i-N] && state.grid[i-N] === target){ seen[i-N] = 1; stack.push(i-N); }
    if(cy < N-1 && !seen[i+N] && state.grid[i+N] === target){ seen[i+N] = 1; stack.push(i+N); }
  }
}

function commit(before){
  if(!before) return;
  let same = true;
  for(let i = 0; i < before.length; i++){
    if(before[i] !== state.grid[i]){ same = false; break; }
  }
  if(!same){
    state.undo.push(before);
    if(state.undo.length > 60) state.undo.shift();
    state.redo.length = 0;
  }
}

/* ================= 指针事件 ================= */
let drawing = false, lastCell = null, beforeGrid = null;

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  const p = cellFromEvent(e);
  if(!p) return;
  drawing = true;
  lastCell = p;

  if(state.tool === 'pick'){ pickAt(p.x, p.y); drawing = false; return; }
  if(state.tool === 'fill'){
    beforeGrid = state.grid.slice();
    floodFill(p.x, p.y);
    commit(beforeGrid); beforeGrid = null;
    draw(); beep(520, 0.07, 'sine', 0.06);
    return;
  }
  beforeGrid = state.grid.slice();
  paintAt(p.x, p.y);
  draw(); tick();
});

canvas.addEventListener('pointermove', function(e){
  if(!drawing) return;
  const p = cellFromEvent(e);
  if(!p) return;
  if(lastCell && (lastCell.x !== p.x || lastCell.y !== p.y)){
    if(state.tool === 'brush' || state.tool === 'eraser'){
      lineTo(lastCell.x, lastCell.y, p.x, p.y, paintAt);
      draw(); tick();
    }
  }
  lastCell = p;
});

function endStroke(e){
  if(!drawing) return;
  drawing = false;
  lastCell = null;
  commit(beforeGrid);
  beforeGrid = null;
  try{ if(e && e.pointerId != null) canvas.releasePointerCapture(e.pointerId); }catch(err){}
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ================= 操作 ================= */
function doUndo(){
  if(!state.undo.length){ toast('没有可以撤销的啦'); return; }
  state.redo.push(state.grid.slice());
  state.grid = state.undo.pop().slice();
  draw(); beep(420, 0.07, 'sine', 0.05);
}
function doRedo(){
  if(!state.redo.length){ toast('没有可以重做的啦'); return; }
  state.undo.push(state.grid.slice());
  state.grid = state.redo.pop().slice();
  draw(); beep(560, 0.07, 'sine', 0.05);
}
function doMirror(){
  const before = state.grid.slice();
  const N = state.N, g = state.grid;
  for(let y = 0; y < N; y++){
    for(let x = 0; x < N >> 1; x++){
      const a = y * N + x, b = y * N + (N - 1 - x);
      const t = g[a]; g[a] = g[b]; g[b] = t;
    }
  }
  commit(before);
  draw(); beep(700, 0.08); toast('镜像翻转 🪞');
}
function doClear(){
  if(!state.grid.some(Boolean)){ toast('底板已经是空的啦'); return; }
  const before = state.grid.slice();
  state.grid = new Array(state.N * state.N).fill(null);
  commit(before);
  draw(); beep(300, 0.12, 'sawtooth', 0.05); toast('已清空 🧹');
}

/* ---------- 熨烫：方圆豆融合动画 ---------- */
function doIron(){
  if(!state.grid.some(Boolean)){ toast('先放几颗豆豆吧～'); return; }
  if(ironRAF){ cancelAnimationFrame(ironRAF); ironRAF = null; }

  els.ironLayer.classList.remove('on');
  void els.ironLayer.offsetWidth;
  els.ironLayer.classList.add('on');
  canvas.classList.add('ironing');

  beep(660, 0.15, 'sine', 0.06);
  setTimeout(function(){ beep(880, 0.18, 'sine', 0.06); }, 260);

  const start = performance.now();
  const DUR = 1400;

  function step(now){
    const p = Math.min(1, (now - start) / DUR);
    ironT = Math.sin(p * Math.PI);   // 0 → 1 → 0
    render();
    if(p < 1){
      ironRAF = requestAnimationFrame(step);
    }else{
      ironT = 0;
      ironRAF = null;
      render();
      els.ironLayer.classList.remove('on');
      canvas.classList.remove('ironing');
      toast('✨ 定型完成！好可爱～');
      beep(1050, 0.2, 'sine', 0.07);
    }
  }
  ironRAF = requestAnimationFrame(step);
}

function toggleSound(){
  state.sound = !state.sound;
  updateToolbar();
  if(state.sound) beep(880, 0.08);
  toast(state.sound ? '音效已开启 🔊' : '音效已关闭 🔇');
}

/* ================= 图片导入 ================= */
function nearestColor(r, g, b){
  let best = PAL[0].hex, bd = Infinity;
  for(let i = 0; i < PAL.length; i++){
    const c = PAL[i];
    const d = (c.R - r) * (c.R - r) + (c.G - g) * (c.G - g) + (c.B - b) * (c.B - b);
    if(d < bd){ bd = d; best = c.hex; }
  }
  return best;
}
function importImage(img){
  const N = state.N;
  const c = document.createElement('canvas');
  c.width = N; c.height = N;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = true;
  if('imageSmoothingQuality' in cx) cx.imageSmoothingQuality = 'high';
  cx.fillStyle = '#FFFFFF';
  cx.fillRect(0, 0, N, N);
  const scale = Math.max(N / img.width, N / img.height);
  const w = img.width * scale, h = img.height * scale;
  cx.drawImage(img, (N - w) / 2, (N - h) / 2, w, h);

  let data;
  try{ data = cx.getImageData(0, 0, N, N).data; }catch(e){ toast('图片读取失败 😢'); return; }

  const before = state.grid.slice();
  const g = new Array(N * N);
  for(let i = 0; i < N * N; i++){
    const a = data[i * 4 + 3];
    if(a < 40){ g[i] = null; continue; }
    g[i] = nearestColor(data[i*4], data[i*4+1], data[i*4+2]);
  }
  state.grid = g;
  commit(before);
  draw();
  toast('图片已转成拼豆 ✨');
  beep(980, 0.12);
}
els.fileInput.addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  let url = null;
  try{ url = URL.createObjectURL(f); }catch(err){ toast('无法读取该图片'); return; }
  const img = new Image();
  img.onload = function(){
    if(url) try{ URL.revokeObjectURL(url); }catch(err){}
    importImage(img);
  };
  img.onerror = function(){
    if(url) try{ URL.revokeObjectURL(url); }catch(err){}
    toast('图片加载失败 😢');
  };
  img.src = url;
});

/* ================= 导出 / 图鉴 ================= */
function exportPNG(){
  if(!state.grid.some(Boolean)){ toast('空白底板导不出哦～'); return; }
  try{
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = '豆豆拼拼_' + state.N + 'x' + state.N + '.png';
    a.href = url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已导出图片 ⬇️');
    beep(880, 0.1);
  }catch(e){ toast('导出失败了 😢'); }
}

const GAL_KEY = 'dd_gallery';
function loadGallery(){ const g = loadLS(GAL_KEY, []); return Array.isArray(g) ? g : []; }
function saveGallery(items){ saveLS(GAL_KEY, items); }

function makeThumb(){
  const S = 128;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const cx = c.getContext('2d');
  cx.fillStyle = '#FFFBF3';
  cx.fillRect(0, 0, S, S);
  try{ cx.drawImage(canvas, 0, 0, S, S); }catch(e){}
  try{ return c.toDataURL('image/png'); }catch(e){ return ''; }
}

function saveWork(){
  if(!state.grid.some(Boolean)){ toast('还没有豆豆哦～'); return; }
  const items = loadGallery();
  items.unshift({
    t: Date.now(),
    n: state.N,
    d: state.grid.map(function(v){ return v || ''; }),
    thumb: makeThumb()
  });
  if(items.length > 16) items.length = 16;
  try{
    localStorage.setItem(GAL_KEY, JSON.stringify(items));
    toast('已保存到图鉴 📖✨');
    beep(880, 0.12);
  }catch(e){
    toast('存储空间不足，先导出图片吧 😢');
  }
}

function openGallery(){
  const items = loadGallery();
  if(!items.length){
    els.galList.innerHTML = '<div class="galEmpty">图鉴还是空的～<br>拼一个作品点 💾 保存吧</div>';
  }else{
    els.galList.innerHTML = items.map(function(it, i){
      return '<div class="gItem" data-i="' + i + '">' +
             '<img src="' + it.thumb + '" alt="作品">' +
             '<button type="button" class="del" data-del="' + i + '">✕</button></div>';
    }).join('');
  }
  els.gallery.classList.remove('hidden');
}
function closeGallery(){ els.gallery.classList.add('hidden'); }

els.closeGal.addEventListener('click', closeGallery);
els.gallery.addEventListener('click', function(e){
  if(e.target === els.gallery){ closeGallery(); return; }
  const del = e.target.closest ? e.target.closest('.del') : null;
  if(del){
    const items = loadGallery();
    items.splice(parseInt(del.dataset.del, 10), 1);
    saveGallery(items);
    openGallery();
    toast('已删除');
    return;
  }
  const item = e.target.closest ? e.target.closest('.gItem') : null;
  if(item){
    const items = loadGallery();
    const data = items[parseInt(item.dataset.i, 10)];
    if(!data) return;
    loadWork(data);
  }
});

function loadWork(data){
  let idx = SIZES.indexOf(data.n);
  if(idx < 0) idx = 0;
  sizeIdx = idx;
  state.N = SIZES[idx];
  els.sizeBtn.textContent = state.N + '×' + state.N;
  state.grid = data.d.slice(0, state.N * state.N).map(function(v){ return v || null; });
  while(state.grid.length < state.N * state.N) state.grid.push(null);
  state.undo.length = 0;
  state.redo.length = 0;
  layout();
  closeGallery();
  toast('已载入作品 ✨');
  beep(920, 0.1);
}

/* ================= 工具栏 ================= */
const TOOLS = [
  { id:'brush',  icon:'🖌️', label:'画笔' },
  { id:'eraser', icon:'🧽', label:'橡皮' },
  { id:'pick',   icon:'💧', label:'吸管' },
  { id:'fill',   icon:'🪣', label:'填充' },
  { id:'undo',   icon:'↩️', label:'撤销', act: doUndo },
  { id:'redo',   icon:'↪️', label:'重做', act: doRedo },
  { id:'mirror', icon:'🪞', label:'镜像', act: doMirror },
  { id:'clear',  icon:'🗑️', label:'清空', act: doClear },
  { id:'iron',   icon:'🔥', label:'熨烫', act: doIron },
  { id:'import', icon:'🖼️', label:'图片', act: function(){ els.fileInput.click(); } },
  { id:'save',   icon:'💾', label:'保存', act: saveWork },
  { id:'export', icon:'⬇️', label:'导出', act: exportPNG },
  { id:'gallery',icon:'📖', label:'图鉴', act: openGallery },
  { id:'sound',  icon:'🔊', label:'音效', act: toggleSound }
];

function buildToolbar(){
  TOOLS.forEach(function(t){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tb';
    b.dataset.id = t.id;
    b.innerHTML = '<span>' + t.icon + '</span><small>' + t.label + '</small>';
    b.addEventListener('click', function(){
      if(t.act){ t.act(); }
      else {
        state.tool = t.id;
        beep(560, 0.04, 'sine', 0.04);
      }
      updateToolbar();
    });
    els.toolbar.appendChild(b);
  });
}
function updateToolbar(){
  const list = els.toolbar.querySelectorAll('.tb');
  for(let i = 0; i < list.length; i++){
    const id = list[i].dataset.id;
    if(id === 'sound') continue;
    list[i].classList.toggle('active', id === state.tool);
  }
  const sb = els.toolbar.querySelector('[data-id="sound"]');
  if(sb){
    sb.classList.toggle('active', state.sound);
    sb.querySelector('span').textContent = state.sound ? '🔊' : '🔇';
  }
}

/* ================= 尺寸切换 ================= */
els.sizeBtn.addEventListener('click', function(){
  if(state.grid.some(Boolean) && !confirmClear()) return;
  sizeIdx = (sizeIdx + 1) % SIZES.length;
  state.N = SIZES[sizeIdx];
  els.sizeBtn.textContent = state.N + '×' + state.N;
  state.grid = new Array(state.N * state.N).fill(null);
  state.undo.length = 0;
  state.redo.length = 0;
  layout();
  toast('底板 ' + state.N + '×' + state.N);
  beep(700, 0.08);
});
function confirmClear(){
  const now = Date.now();
  if(els.sizeBtn._lastTap && now - els.sizeBtn._lastTap < 2200){
    els.sizeBtn._lastTap = 0;
    return true;
  }
  els.sizeBtn._lastTap = now;
  toast('再点一次切换尺寸（会清空底板）');
  return false;
}

/* ================= Toast ================= */
let toastTimer = null;
function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ els.toast.classList.remove('show'); }, 1600);
}

/* ================= 初始化 ================= */
buildToolbar();
updateToolbar();
renderPalette();
layout();
requestAnimationFrame(layout);
window.addEventListener('resize', function(){ layout(); });
window.addEventListener('orientationchange', function(){ setTimeout(layout, 200); });
if(window.ResizeObserver){
  let roTimer = null;
  try{
    new ResizeObserver(function(){
      clearTimeout(roTimer);
      roTimer = setTimeout(layout, 70);
    }).observe(els.stage);
  }catch(e){}
}
setTimeout(function(){ toast('选个颜色，点格子放豆豆吧 🧩'); }, 500);

})();
</script>
